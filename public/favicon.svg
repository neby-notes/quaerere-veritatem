<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    .book { fill: none; stroke: #252820; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .page-line { fill: none; stroke: #252820; stroke-width: 1.5; stroke-linecap: round; }
    @media (prefers-color-scheme: dark) {
      .book { stroke: #E8E5DB; }
      .page-line { stroke: #E8E5DB; }
    }
  </style>
  <!-- Contorno del libro abierto -->
  <path class="book" d="M50 18 
    C45 14, 30 12, 20 16 
    C15 18, 12 22, 12 28 
    L12 72 
    C12 78, 15 80, 20 78 
    C30 74, 45 74, 50 78 
    C55 74, 70 74, 80 78 
    C85 80, 88 78, 88 72 
    L88 28 
    C88 22, 85 18, 80 16 
    C70 12, 55 14, 50 18 
    Z" />
  <!-- Lomo/encuadernación central -->
  <line class="book" x1="50" y1="18" x2="50" y2="78" />
  <!-- Líneas de texto página izquierda -->
  <line class="page-line" x1="20" y1="30" x2="44" y2="30" />
  <line class="page-line" x1="20" y1="38" x2="44" y2="38" />
  <line class="page-line" x1="20" y1="46" x2="44" y2="46" />
  <line class="page-line" x1="20" y1="54" x2="40" y2="54" />
  <!-- Líneas de texto página derecha -->
  <line class="page-line" x1="56" y1="30" x2="80" y2="30" />
  <line class="page-line" x1="56" y1="38" x2="80" y2="38" />
  <line class="page-line" x1="56" y1="46" x2="80" y2="46" />
  <line class="page-line" x1="60" y1="54" x2="80" y2="54" />
</svg>